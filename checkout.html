<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div id="checkout">
            <h2>Customer Details</h2>
            <label>Name</label>
            <input type="text" id="name">
            <label>Phone No</label>
            <input type="number" id="No">
            <label>Address</label>
            <input type="text" id="Address">
            <button id="orderplaced">Placed order</button>
        </div>
    </main>
    <script>
        const placedorder=document.getElementById("orderplaced");
        placedorder.addEventListener('click', function(){
            const name=document.getElementById("name").value;
            const phoneno=document.getElementById("No").value;
            const Address=document.getElementById("Address").value;
            const cart=JSON.parse(localStorage.getItem("cart"))||[];
            if (cart.length==0){
                alert("your cart is empty!");
                return;
            }
            const items=cart.map(function(item){
                return {
                    product_id:item.product.id,
                    quantity:item.quantity
                };
            });
            if(name===""||phoneno===""||Address===""){
                alert("Fill the value first");
                return ;
            }
            console.log("all value filled");
            const orderId = "SS-" + Math.floor(100000 + Math.random() * 900000);
            const orderData = {
                order_id: orderId,
                customer_name: name,
                phone: phoneno,
                address: Address,
                items: items
            };
            localStorage.setItem("orderId", orderId);
            
        fetch("http://127.0.0.1:8000/orders", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(orderData)
        }).then(function(response){
            if(!response.ok){
                throw new Error("order placement failed");
                
            }
            return response.json();
        }).then(function(data){
            localStorage.setItem("order_id",data.order_id);
            localStorage.removeItem("cart");
            window.location.href="orderplaced.html";
        }).catch(function(error){
            console.error("order error",error);
            alert("Unable to placed order, Please Try Again!");
        })

        });
    </script>
</body>
</html>
