<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="YourCart">Your Cart</h1>
    <div id="product-container"></div>
</body>
<script>
    const savedcart=localStorage.getItem("cart");
    const cart = JSON.parse(savedcart) || [];
    console.log(cart);
    for(const [index,item] of cart.entries()){
        const product=item.product;
        const card=document.createElement("div");
        const container=document.getElementById("product-container");
        card.className ="product-card";
        card.innerHTML=`
        <img src="${product.image}">
        <h2>${product.name}</h2>
        <p>Rating:${product.rating}</p>
        <p>Price:${product.price}</p>
        <p class="quantity">Quantity:${item.quantity}</p>
        <button class="increase">+</button> 
        <button class="decrease">-</button>`;
        const increment=card.querySelector('.increase');
        const quantitytext=card.querySelector('.quantity');
        increment.addEventListener('click',function(){
            item.quantity++;
            quantitytext.textContent=`Quantity:${item.quantity}`;
            localStorage.setItem("cart", JSON.stringify(cart));
        });

        const decrement=card.querySelector('.decrease');
        decrement.addEventListener("click", function(){

            if(item.quantity == 1){

                const currentIndex = cart.indexOf(item);

                cart.splice(currentIndex, 1);

                card.remove();

                localStorage.setItem("cart", JSON.stringify(cart));
                console.log(localStorage.getItem("cart"))
            }
            else{
                item.quantity--;

                quantitytext.textContent = `Quantity:${item.quantity}`;

                localStorage.setItem("cart", JSON.stringify(cart));
            }

        });
        container.appendChild(card);
        
        }
    
        
    

</script>
</html>
