    <h1>Product Details</h1>

    <script>
        let quantity = 1;
        // Get the information from the URL
        const params = new URLSearchParams(window.location.search);

        // Get product ID
        const productId = params.get("id");


        // Find the selected product
        const product = products.find(function(item) {
            return item.id === Number(productId);
        });
        const id_url = `http://127.0.0.1:8000/product/${productId}`;

        async function fetch_with_id() {
            let response = await fetch(id_url);
            let product = await response.json();

            console.log(product);

            const productDetails = document.getElementById("product-details");
            const productimmage = document.getElementById("product-image");

            productimmage.innerHTML = `
                <img src="${product.image}" alt="${product.name}">
            `;

            productDetails.innerHTML = `
                <h2>${product.name}</h2>
                <p>Rating: ${product.rating}</p>
                <p>Reviews: ${product.reviews}</p>
                <p>Category: ${product.category}</p>
                <p>Price: ₹${product.price}</p>
                <p id="quantity">${quantity}</p>
                <button id="decrease">-</button>
                <button id="add-cart">Add to Cart</button>
                <button id="increase">+</button>
            `;
            const decreaseButton = document.getElementById("decrease");
            const increaseButton = document.getElementById("increase");
            const quantityDisplay = document.getElementById("quantity");
    
            increaseButton.addEventListener("click", function() {
                quantity++;
                quantityDisplay.textContent = quantity;
            });
    
            decreaseButton.addEventListener("click", function() {
                if (quantity > 1) {
                    quantity--;
                    quantityDisplay.textContent = quantity;
                }
            });
            const addCartButton = document.getElementById("add-cart");
    
            addCartButton.addEventListener("click", function() {
    
                let cart = JSON.parse(localStorage.getItem("cart")) || [];
    
                const existingItem = cart.find(function(item) {
                    return item.product.id === product.id;
                });
    
                if (existingItem) {
                    existingItem.quantity+=quantity;
                }
                else {
                    cart.push({
                        product: product,
                        quantity: quantity
                    });
                }
    
                localStorage.setItem("cart", JSON.stringify(cart));
                window.location.href="cart.html";
                console.log("Added to cart:", product.name);
                });
        }

        fetch_with_id();
